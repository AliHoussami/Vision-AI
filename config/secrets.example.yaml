# Copy to config/secrets.yaml (gitignored). A flat  name: value  map.
#
# Reference a value from a camera source in site.yaml:
#     source: "rtsp://${SECRET:cam-north}@192.168.1.50:554/Streaming/Channels/101"
#     source: "rtsp://admin:${SECRET:cam-north-pw}@192.168.1.50:554/..."
#
# The value is substituted verbatim, so store "user:pass" or just the
# password to match the URL around the placeholder.
#
# This file is the lowest-priority source. These override it, in order:
#   1. env var   FOOTFALL_SECRET_CAM_NORTH='admin:s3cret'
#   2. OS keyring  (pip install keyring; then: keyring set footfall cam-north)
#
# Point at a different file with  export FOOTFALL_SECRETS_FILE=/path/to/it

cam-north: "admin:changeme"
cam-north-pw: "changeme"
